<!DOCTYPE html>
<html lang="fa" dir="rtl" translate="no">
<head>
<meta charset="UTF-8"/>
<meta name="google" content="notranslate"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>نبرد کارت‌های جام جهانی ۲۰۲۶</title>
<style>
:root{--gl:#f3d778;--gm:#d4af37;--bg:rgba(11,20,31,.93)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 50% 0%,#103824,#07131e 50%,#04070c);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 10px 26px}
#errBar{display:none;width:100%;max-width:500px;margin-bottom:10px;padding:10px;border-radius:12px;background:#7f1d1d;border:1.5px solid #f87171;color:#fecaca;font-size:.84rem;font-weight:700;text-align:center}
.screen{width:100%;max-width:440px;display:none;flex-direction:column;align-items:center;gap:13px}
.screen.wide{max-width:540px}
.panel{width:100%;background:var(--bg);border:2px solid rgba(212,175,55,.65);border-radius:24px;padding:22px 16px;box-shadow:0 20px 50px rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;gap:13px;text-align:center}
.logo{width:74px;height:74px;border-radius:50%;border:2px solid var(--gm);font-size:2.2rem;background:radial-gradient(circle,rgba(243,215,120,.3),rgba(14,58,34,.75));display:flex;align-items:center;justify-content:center}
.tpill{padding:8px 18px;border-radius:999px;background:rgba(212,175,55,.16);border:1.5px solid var(--gm);color:var(--gl);font-size:.95rem;font-weight:900}
.title{font-size:1.42rem;font-weight:900;color:var(--gl);line-height:1.4}
.sub{font-size:.88rem;color:#cbd5e1;line-height:1.7}
.ver{font-size:.72rem;color:#64748b}
.btn{width:100%;font-family:inherit;font-size:.98rem;font-weight:700;padding:13px 16px;border-radius:14px;border:1.6px solid rgba(212,175,55,.65);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation}
.btn:hover:not(:disabled){filter:brightness(1.13)}
.btn:disabled{opacity:.55;cursor:default}
.bplay{font-size:1.22rem;font-weight:900;background:linear-gradient(135deg,#f3d778,#c9a227,#8c6d1f);color:#140f02;border-color:#fff3b0}
.bgreen{background:linear-gradient(135deg,#1b7a43,#0e4a27);border-color:#4ade80}
.bblue{background:linear-gradient(135deg,#154c8a,#0a284d);border-color:#60a5fa}
.bghost{background:transparent;border-color:rgba(255,255,255,.22);color:#cbd5e1;font-size:.88rem;padding:10px 14px}
.bsm{width:auto;font-size:.82rem;padding:7px 12px;border-radius:11px}
.fg{width:100%;text-align:right;display:flex;flex-direction:column;gap:5px}
.fl{font-size:.85rem;font-weight:700;color:var(--gl)}
.inp{width:100%;font-family:inherit;font-size:1rem;font-weight:700;padding:11px 14px;border-radius:13px;border:1.6px solid rgba(212,175,55,.5);background:rgba(0,0,0,.45);color:#fff;outline:none;text-align:center}
.mgrid{width:100%;display:flex;flex-direction:column;gap:9px}
.mbtn{justify-content:space-between}
.mmeta{font-size:.78rem;color:var(--gl);background:rgba(0,0,0,.35);padding:4px 10px;border-radius:10px;border:1px solid rgba(212,175,55,.4)}
.codebox{width:100%;background:rgba(0,0,0,.48);border:2px dashed var(--gm);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.codenum{font-size:2.1rem;font-weight:900;letter-spacing:6px;color:var(--gl);direction:ltr}
.crow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.plist{width:100%;display:flex;flex-direction:column;gap:7px}
.pslot{width:100%;padding:9px 13px;border-radius:12px;background:rgba(255,255,255,.05);border:1.2px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:space-between;font-size:.88rem;font-weight:700}
.pslot.on{background:rgba(24,165,88,.16);border-color:rgba(74,222,128,.55)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-left:8px;background:#64748b}
.pslot.on .dot{background:#4ade80}
.msg{width:100%;min-height:36px;padding:8px 12px;border-radius:12px;background:rgba(212,175,55,.15);border:1.3px solid rgba(212,175,55,.45);color:var(--gl);font-size:.88rem;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.5}
.msg.ok{background:rgba(24,165,88,.2);border-color:#4ade80;color:#86efac}
.msg.err{background:rgba(217,65,78,.2);border-color:#f87171;color:#fecaca}
.msg.turn{background:linear-gradient(90deg,rgba(212,175,55,.28),rgba(24,165,88,.28));border-color:#fff3b0;color:#fff}
.topbar{width:100%;background:var(--bg);border:1.5px solid rgba(212,175,55,.55);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.trow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.06);border:1.2px solid rgba(255,255,255,.18);font-size:.82rem;font-weight:700}
.chip.act{background:rgba(212,175,55,.26);border-color:#fff3b0;color:#fff3b0}
.chip.out{opacity:.45;text-decoration:line-through}
.pot{padding:5px 11px;border-radius:10px;background:rgba(234,88,12,.22);border:1.3px solid #fb923c;color:#fed7aa;font-size:.82rem;font-weight:800}
.fcard{width:100%;max-width:410px;border-radius:24px;padding:14px;background:#050505;border:2.4px solid var(--gm);box-shadow:0 18px 46px rgba(0,0,0,.9)}
.chd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px 12px;direction:rtl}
.cfa{flex:1;text-align:right;font-size:1.25rem;font-weight:900;color:#fff;line-height:1.25}
.fbox{width:78px;height:50px;border-radius:9px;overflow:hidden;border:1.8px solid var(--gm);background:#000;flex-shrink:0}
.fbox img{width:100%;height:100%;object-fit:cover;display:block}
.cen{flex:1;text-align:left;direction:ltr;font-size:1.05rem;font-weight:800;color:var(--gl);line-height:1.25}
.pframe{width:100%;aspect-ratio:16/8;border-radius:13px;overflow:hidden;border:1.6px solid var(--gm);background:#000;position:relative;margin-bottom:10px}
.pframe img.ci{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:2;display:none}
.pframe.hp img.ci{display:block}
.art,.art svg{width:100%;height:100%;display:block}
.slist{display:flex;flex-direction:column;gap:7px}
.srow{width:100%;font-family:inherit;display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:13px;border:1.5px solid rgba(212,175,55,.8);color:#fff;cursor:pointer}
.srow:nth-child(odd){background:#111}
.srow:nth-child(even){background:#1a1a1a}
.srow:hover:not(:disabled){background:#242013;border-color:#fff3b0}
.srow:disabled{cursor:default;opacity:.85}
.slbl{font-size:1.05rem;font-weight:800;color:#f8f4e3}
.sval{font-size:1.22rem;font-weight:900;min-width:60px;text-align:left;color:var(--gl)}
.rbox{width:100%;background:#070707;border:2px solid var(--gm);border-radius:22px;padding:18px 14px;display:flex;flex-direction:column;gap:14px;text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.ccard{background:#121212;border:1.6px solid rgba(255,255,255,.18);border-radius:15px;padding:11px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ccard.win{background:rgba(24,165,88,.26);border-color:#4ade80}
.ccard.tie{background:rgba(234,88,12,.22);border-color:#fb923c}
.cflag{width:54px;height:36px;border-radius:6px;overflow:hidden;border:1px solid var(--gm)}
.cflag img{width:100%;height:100%;object-fit:cover;display:block}
.vbox{width:100%;background:radial-gradient(circle at top,rgba(212,175,55,.28),#070707);border:2.5px solid #fff3b0;border-radius:26px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
</style>
</head>
<body>
<div id="errBar"></div>
<section id="sHome" class="screen" style="display:flex"><div class="panel"><div class="logo">🏆</div><h1 class="title">نبرد کارت‌های جام جهانی ۲۰۲۶</h1><div class="tpill" id="tBadge">🏆 تعداد جام‌های شما: ۰</div><button type="button" class="btn bplay" data-a="play">▶ پلی (شروع)</button><div class="ver">نسخه ۱۰</div></div></section>
<section id="sMenu" class="screen"><div class="panel"><h2 class="title">ورود به بخش آنلاین</h2><div class="fg"><label class="fl" for="n1">نام و نام خانوادگی شما:</label><input id="n1" class="inp" placeholder="مثلاً: هیراد عامل" maxlength="24"/></div><button type="button" class="btn bgreen" data-a="oc">➕ ایجاد اتاق</button><button type="button" class="btn bblue" data-a="oj">🚪 رفتن به اتاق دوستان</button><button type="button" class="btn bghost" data-a="home">بازگشت به صفحه اصلی</button></div></section>
<section id="sCreate" class="screen"><div class="panel"><h2 class="title">تعداد بازیکنان را انتخاب کن</h2><div class="mgrid"><button type="button" class="btn bgreen mbtn" data-a="m2"><span>👥 بازی ۲ نفره</span><span class="mmeta">نفری ۲۴ کارت</span></button><button type="button" class="btn bgreen mbtn" data-a="m3"><span>👥 بازی ۳ نفره</span><span class="mmeta">نفری ۱۶ کارت</span></button><button type="button" class="btn bgreen mbtn" data-a="m4"><span>👥 بازی ۴ نفره</span><span class="mmeta">نفری ۱۲ کارت</span></button></div><button type="button" class="btn bghost" data-a="play">بازگشت</button></div></section>
